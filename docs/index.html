<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Web Tool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #243b70 0, transparent 35%),
                radial-gradient(circle at bottom right, #351b59 0, transparent 35%),
                #080b12;
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        .center {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 24px;
            background: rgba(17, 21, 32, .82);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #6d5dfc, #9b5cff);
            font-size: 27px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(109,93,252,.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #8f98aa;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #b8c0d0;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #293143;
            border-radius: 12px;
            outline: none;
            background: #111621;
            color: white;
            font-size: 15px;
            transition: .2s;
        }

        input:focus {
            border-color: #7465ff;
            box-shadow: 0 0 0 3px rgba(116,101,255,.15);
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 14px 18px;
            color: white;
            background: linear-gradient(135deg, #6757f5, #9255ff);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .full {
            width: 100%;
            margin-top: 24px;
        }

        .error {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            color: #ff9d9d;
            background: rgba(255,60,60,.1);
            border: 1px solid rgba(255,60,60,.2);
        }

        .dashboard {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: linear-gradient(135deg, #6757f5, #9255ff);
        }

        .brand strong {
            display: block;
        }

        .online {
            color: #62e6a5;
            font-size: 12px;
        }

        .logout {
            background: #171d2a;
            border: 1px solid #293143;
            color: #adb6c8;
        }

        .panel {
            padding: 28px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 22px;
            background: rgba(17,21,32,.8);
            backdrop-filter: blur(20px);
        }

        .panel h2 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 18px;
        }

        .status {
            margin-top: 25px;
            padding: 18px;
            border-radius: 15px;
            background: #0d121c;
            border: 1px solid #222a39;
        }

        .status-head {
            color: #8892a5;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .status-value {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #8993a5;
        }

        .processing .dot {
            background: #f5c84b;
            box-shadow: 0 0 12px #f5c84b;
            animation: pulse 1s infinite;
        }

        .done .dot {
            background: #42df91;
            box-shadow: 0 0 12px #42df91;
        }

        .failed .dot {
            background: #ff5e69;
            box-shadow: 0 0 12px #ff5e69;
        }

        @keyframes pulse {
            50% {
                opacity: .35;
            }
        }

        .result {
            margin-top: 18px;
            padding: 15px;
            border-radius: 12px;
            background: #090d15;
            color: #9ba6ba;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            overflow: auto;
        }

        @media (max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="center">

    <div class="card">

        <div class="logo">⚡</div>

        <h1>Web Tool</h1>

        <p class="subtitle">
            Přihlas se pro pokračování.
        </p>

        <label>Username</label>
        <input id="username" autocomplete="username">

        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password">

        <button class="full" id="loginButton" onclick="login()">
            LOGIN
        </button>

        <div id="loginError" class="error hidden"></div>

    </div>

</div>


<!-- DASHBOARD -->

<div id="dashboardScreen" class="dashboard hidden">

    <div class="topbar">

        <div class="brand">

            <div class="brand-icon">
                ⚡
            </div>

            <div>
                <strong>Web Tool</strong>
                <span class="online">● Online</span>
            </div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>


    <div class="panel">

        <h2>Create Request</h2>

        <p class="subtitle">
            Vyplň parametry požadavku.
        </p>

        <div class="grid">

            <div>
                <label>Score</label>
                <input id="score" type="number" value="500">
            </div>

            <div>
                <label>Time (ms)</label>
                <input id="time" type="number" value="12000">
            </div>

            <div>
                <label>Name</label>
                <input id="name" placeholder="Name">
            </div>

            <div>
                <label>Count</label>
                <input id="count" type="number" min="1" max="100" value="1">
            </div>

            <div>
                <label>Activity ID</label>
                <input id="activityId" type="number">
            </div>

            <div>
                <label>Template ID</label>
                <input id="templateId" type="number">
            </div>

        </div>

        <button class="full" id="sendButton" onclick="sendRequest()">
            SEND REQUEST
        </button>


        <div id="status" class="status">

            <div class="status-head">
                STATUS
            </div>

            <div class="status-value">
                <span class="dot"></span>
                <span id="statusText">Ready</span>
            </div>

        </div>

        <div id="result" class="result hidden"></div>

    </div>

</div>


<script>

const API = "https://web-qzeu.onrender.com";

async function api(url, options = {}) {

    return fetch(API + url, {
        credentials: "include",
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });

}


async function checkAuth() {

    try {

        const response = await api("/check-auth");
        const data = await response.json();

        if (data.logged_in) {
            showDashboard();
        } else {
            showLogin();
        }

    } catch (error) {
        showLogin();
    }

}


function showLogin() {

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document
        .getElementById("dashboardScreen")
        .classList.add("hidden");

}


function showDashboard() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("dashboardScreen")
        .classList.remove("hidden");

}


async function login() {

    const button = document.getElementById("loginButton");
    const error = document.getElementById("loginError");

    error.classList.add("hidden");

    button.disabled = true;
    button.textContent = "PŘIHLAŠOVÁNÍ...";

    try {

        const response = await api("/login", {
            method: "POST",

            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Přihlášení selhalo.");
        }

        showDashboard();

    } catch (error) {

        errorBox = document.getElementById("loginError");

        errorBox.textContent = error.message;
        errorBox.classList.remove("hidden");

    } finally {

        button.disabled = false;
        button.textContent = "LOGIN";

    }

}


async function logout() {

    await api("/logout", {
        method: "POST"
    });

    showLogin();

}


function setStatus(type, text) {

    const status = document.getElementById("status");

    status.className = "status";

    if (type) {
        status.classList.add(type);
    }

    document.getElementById("statusText").textContent = text;

}


async function sendRequest() {

    const button = document.getElementById("sendButton");
    const result = document.getElementById("result");

    button.disabled = true;

    result.classList.add("hidden");

    setStatus("processing", "Processing...");

    const data = {
        score: document.getElementById("score").value,
        time: document.getElementById("time").value,
        name: document.getElementById("name").value,
        count: document.getElementById("count").value,
        activityId: document.getElementById("activityId").value,
        templateId: document.getElementById("templateId").value
    };

    try {

        const response = await api("/run", {
            method: "POST",
            body: JSON.stringify(data)
        });

        const json = await response.json();

        if (!response.ok || !json.success) {
            throw new Error(json.error || "Request failed.");
        }

        setStatus("done", "Done");

        result.textContent =
            JSON.stringify(json, null, 2);

        result.classList.remove("hidden");

    } catch (error) {

        setStatus("failed", "Error");

        result.textContent = error.message;
        result.classList.remove("hidden");

    } finally {

        button.disabled = false;

    }

}


checkAuth();

</script>

</body>
</html>
