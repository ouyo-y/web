<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Python Web Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #eee;
            padding: 15px;
        }
    </style>
</head>

<body>

<h1>Python Web Tool</h1>

<input id="score" type="number" placeholder="Score">
<input id="time" type="number" placeholder="Time (ms)">
<input id="name" placeholder="Name">
<input id="count" type="number" value="1" min="1" placeholder="Count">

<button onclick="runPython()">Spustit</button>

<div id="result"></div>

<script>

async function runPython() {

    const result = document.getElementById("result");

    result.textContent = "Spouštím...";

    const data = {
        score: document.getElementById("score").value,
        time: document.getElementById("time").value,
        name: document.getElementById("name").value,
        count: document.getElementById("count").value
    };

    try {

        const response = await fetch(
            "https://TVUJ-BACKEND.onrender.com/run",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );

        const json = await response.json();

        result.textContent =
            JSON.stringify(json, null, 2);

    } catch (error) {

        result.textContent =
            "Chyba: " + error;

    }
}

</script>

</body>
</html>
